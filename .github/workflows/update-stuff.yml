name: Update stuff

on:
  schedule:
    - cron: "20 4 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  update-repos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # See docs/CUSTOMIZE.md for details on how to set up PAT for triggering subsequent workflows
      #        with:
      #          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies

      - name: HELLP HELP MEEE 🍆
        run: |
          pip3 install --upgrade requests pyyaml
          python3 python_scripts/repos.py

      - name: Configure Git (i hardly know her)
        run: |
          git config --local user.email "pranavraj575@gmail.com"
          git config --local user.name "evil pranav"
          echo "🔧 Git configured  (i hardly know her)."

      - name: Commit and push if changed
        run: |
          git add _pages/repos.md
          git diff --staged --quiet || (
            echo "📤 Committing and pushing changes..."
            git commit -m "auto update repos"
            git push
          )

  update-recursive-ss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # See docs/CUSTOMIZE.md for details on how to set up PAT for triggering subsequent workflows
      #        with:
      #          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies

      - name: recursion recursion recursion recursion recursion recursion recursion
        run: |
          pip3 install --upgrade numpy Pillow playwright
          playwright install
          python3 python_scripts/recursive_ss.py

      - name: cleaning img
        run: |
          python3 python_scripts/clear_metadata.py --img assets/img/stuff/repo_screenshot.png

      - name: Configure Git (i hardly know her)
        run: |
          git config --local user.email "pranavraj575@gmail.com"
          git config --local user.name "evil pranav"
          echo "🔧 Git configured (i hardly know her)."

      - name: Commit and push if changed
        run: |
          git add assets/img/stuff/repo_screenshot.png
          git diff --staged --quiet || (
            echo "📤 Committing and pushing changes..."
            git commit -m "recursion recursion recursion recursion recursion recursion recursion"
            git push
          )
