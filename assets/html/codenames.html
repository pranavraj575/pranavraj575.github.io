<script>
  function permute_children(element){
    indices=[];
    for (i=0;i<element.childElementCount;i++){
      indices.push(i);
    }
    inner_htmls=[];
    for (i=0;i<element.childElementCount;i++){
      random_idx=indices.splice(Math.floor(Math.random()*indices.length),1)[0];
      inner_htmls.push(element.children[random_idx].innerHTML);
    }

    for (i=0;i<element.childElementCount;i++){
      element.children[i].innerHTML=inner_htmls[i];
    }
  }

  function loop_permute_children(element,delay=69){
    permute_children(element);
    setTimeout(function(){loop_permute_children(element,delay=delay)}, delay);
  }

  loop_permute_children(document.getElementById("authors"))
</script>
